[project]
name = "beehive-studio-agent-orchestrator"
version = "1.0.0rc0"
description = "FastAPI + LangGraph multi-agent brain for Beehive Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=0.2",
    "pydantic>=2.9",
    "mido>=1.3",
    "ollama>=0.3",
    "python-multipart>=0.0.9",
    "lupa>=2.0",           # Lua embedding for user scripts / Lua agents (Replit-like)
    "langsmith>=0.1",      # Tracing with existing key from Supabase / .env
    "langchain-ollama>=0.2",
    "httpx>=0.28.1",
    "aiosqlite>=0.20",
    "pydub>=0.25",
    "librosa>=0.10",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pytest-cov>=6.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# Development mode - no strict packaging required yet
[tool.hatch.build.targets.wheel]
packages = ["."]
