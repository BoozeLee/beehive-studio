[project]
name = "beehive-studio-agent-orchestrator"
version = "0.4.0-beta"
description = "FastAPI + LangGraph multi-agent brain for Beehive Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=0.2",
    "pydantic>=2.9",
    "mido>=1.3",
    "ollama>=0.3",
    "python-multipart>=0.0.31",
    "lupa>=2.0",           # Lua embedding for user scripts / Lua agents (Replit-like)
    "langsmith>=0.1",      # Tracing with existing key from Supabase / .env
    "langchain-ollama>=0.2",
    "httpx>=0.28.1",
    "aiosqlite>=0.20",
    "pydub>=0.25",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

# Development mode - no strict packaging required yet
[tool.hatch.build.targets.wheel]
packages = ["."]
