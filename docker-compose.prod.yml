version: '3.8'

services:
  # Main Beehive Studio Application
  web:
    build:
      context: ./apps/desktop
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:9876
      - VITE_WS_URL=ws://localhost:9876
    depends_on:
      - api
      - vllm
      - git-projects
    networks:
      - beehive-network
    restart: unless-stopped

  # Production API Gateway
  api:
    build:
      context: ./services/agent-orchestrator
      dockerfile: Dockerfile.prod
    ports:
      - "9876:9876"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/beehive
      - REDIS_URL=redis://redis:6379
      - AI_API_KEY=${AI_API_KEY}
      - VLLM_URL=http://vllm:8000
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - postgres
      - redis
      - vllm
      - git-projects
    volumes:
      - ./services/agent-orchestrator:/app
      - model_cache:/app/models
    networks:
      - beehive-network
    restart: unless-stopped

  # vLLM Inference Service
  vllm:
    build:
      context: ./services/inference/vllm
      dockerfile: Containerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=microsoft/Phi-4-mini-instruct
      - MAX_MODEL_LEN=4096
      - GPU_MEMORY_UTILIZATION=0.85
    volumes:
      - vllm_models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - beehive-network
    restart: unless-stopped

  # Git-Native Projects Service
  git-projects:
    build:
      context: ./services/git-projects
      dockerfile: Dockerfile
    ports:
      - "9877:9876"
    environment:
      - AI_API_KEY=${AI_API_KEY}
      - STORAGE_PATH=/data/projects
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/beehive_projects
    volumes:
      - git_projects_data:/data/projects
      - git_metadata_data:/data/ai-metadata
      - git_repositories_data:/data/repositories
    depends_on:
      - postgres
      - redis
    networks:
      - beehive-network
    restart: unless-stopped

  # Ollama (Fallback AI Service)
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - beehive-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=beehive
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS="--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/postgresql.conf:/etc/postgresql/postgresql.conf
    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - beehive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --loadmodule /usr/local/lib/redislua.so
    volumes:
      - redis_data:/data
      - ./database/redis-init.lua:/docker-entrypoint-initdb.d/redis-init.lua
      - ./database/redis.conf:/etc/redis/redis.conf
    networks:
      - beehive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Monitoring and Logging
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - beehive-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - beehive-network
    restart: unless-stopped

  # File Storage (MinIO S3 Compatible)
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - beehive-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - web
      - api
      - git-projects
    networks:
      - beehive-network
    restart: unless-stopped

  # Background Worker (Celery)
  worker:
    build:
      context: ./services/agent-orchestrator
      dockerfile: Dockerfile.worker
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/beehive
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - postgres
    volumes:
      - ./services/agent-orchestrator:/app
      - model_cache:/app/models
    networks:
      - beehive-network
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info

  # Scheduler (Celery Beat)
  scheduler:
    build:
      context: ./services/agent-orchestrator
      dockerfile: Dockerfile.worker
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/beehive
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - postgres
    volumes:
      - ./services/agent-orchestrator:/app
    networks:
      - beehive-network
    restart: unless-stopped
    command: celery -A app.celery beat --loglevel=info

  # AudioCraft Music Generation (Open-source)
  audiocraft:
    build:
      context: ./services/audiocraft
      dockerfile: Dockerfile
    container_name: beehive-studio-audiocraft
    ports:
      - "8000:8000"
    volumes:
      - ./services/audiocraft/models:/app/models
      - ./services/audiocraft/outputs:/app/outputs
    environment:
      - AUDIOCRAFT_MODEL=small
      - AUDIOCRAFT_DEVICE=cuda
      - PYTHONPATH=/app
    networks:
      - beehive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Mubert API (Commercial royalty-free)
  mubert-api:
    image: python:3.11-slim
    container_name: beehive-studio-mubert
    ports:
      - "8001:8000"
    volumes:
      - ./services/mubert:/app
    environment:
      - MUBERT_API_KEY=${MUBERT_API_KEY}
      - FLASK_ENV=production
    networks:
      - beehive-network
    restart: unless-stopped
    depends_on:
      - redis
    command: python -m flask run --host=0.0.0.0 --port=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Soundraw API (Premium)
  soundraw-api:
    image: python:3.11-slim
    container_name: beehive-studio-soundraw
    ports:
      - "8002:8000"
    volumes:
      - ./services/soundraw:/app
    environment:
      - SOUNDRAW_API_KEY=${SOUNDRAW_API_KEY}
      - FLASK_ENV=production
    networks:
      - beehive-network
    restart: unless-stopped
    depends_on:
      - redis
    command: python -m flask run --host=0.0.0.0 --port=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Suno AI (Complete songs)
  suno-api:
    image: python:3.11-slim
    container_name: beehive-studio-suno
    ports:
      - "8003:8000"
    volumes:
      - ./services/suno:/app
    environment:
      - FLASK_ENV=production
    networks:
      - beehive-network
    restart: unless-stopped
    depends_on:
      - redis
    command: python -m flask run --host=0.0.0.0 --port=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Gemini AI Integration
  gemini:
    image: python:3.11-slim
    container_name: beehive-studio-gemini
    ports:
      - "8004:8000"
    volumes:
      - ./services/gemini:/app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FLASK_ENV=production
    networks:
      - beehive-network
    restart: unless-stopped
    depends_on:
      - redis
    command: python -m flask run --host=0.0.0.0 --port=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  minio_data:
  vllm_models:
  git_projects_data:
  git_metadata_data:
  git_repositories_data:
  ollama_data:
  model_cache:
  audiocraft_models:
  audiocraft_outputs:
  mubert_data:
  soundraw_data:
  suno_data:
  gemini_data:

networks:
  beehive-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16