[package]
name = "mixhive_bridge"
version = "0.1.0"
edition = "2021"
description = "Bridge between Beehive Studio IDE and MixHive social platform API"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"

[lib]
crate-type = ["rlib"]
