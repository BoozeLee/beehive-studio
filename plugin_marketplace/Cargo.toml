[package]
name = "plugin_marketplace"
version = "0.1.0"
edition = "2021"
description = "Plugin marketplace and WASM plugin runtime for Beehive Studio IDE"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["cors"] }
wasmtime = "45.0.2"

[dev-dependencies]
tokio-test = "0.4"

[lib]
crate-type = ["rlib"]
