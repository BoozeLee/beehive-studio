# Beehive Studio Redis Configuration
# Production-optimized settings for Beehive Studio

# General Configuration
daemonize no
pidfile /var/run/redis_6379.pid
port 6379
bind 0.0.0.0
timeout 300
tcp-keepalive 60
tcp-backlog 511

# Logging
loglevel notice
logfile ""
syslog-enabled no
syslog-ident redis
syslog-facility local0

# Databases
databases 16

# Snapshotting (RDB)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Append-only file (AOF)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency Monitoring
latency-monitor-threshold 0

# Advanced Configuration
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Active defragmentation
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 5
active-defrag-cycle-max 75

# Client output buffering
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Advanced Config
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# Beehive Studio Specific Configuration
# Memory management
maxmemory 2gb
maxmemory-policy allkeys-lru

# Network optimization
tcp-keepalive 60
tcp-backlog 511

# Persistence settings optimized for production
save 900 1      # Save if at least 1 key changed in 900 seconds
save 300 10     # Save if at least 10 keys changed in 300 seconds
save 60 10000   # Save if at least 10000 keys changed in 60 seconds

# AOF settings
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Slow log for debugging
slowlog-log-slower-than 10000  # 10ms
slowlog-max-len 128

# Client settings
timeout 300
tcp-keepalive 60

# Lua scripting
lua-time-limit 5000

# Security - will be overridden by environment variable
# requirepass your_secure_redis_password

# Cluster configuration (if needed in future)
# cluster-enabled yes
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 5000
# cluster-require-full-coverage no
# cluster-slave-validity-factor 10
# cluster-migration-barrier 1
# cluster-replica-validity-factor 10

# Beehive Studio specific key patterns and memory optimization
# User sessions expire after 24 hours
# Project data cache TTL: 1 hour
# AI model responses cache TTL: 1 day
# WebSocket connections TTL: 1 hour

# Memory optimization for different data types
# Sessions: hash structure
# Projects: JSON structure
# Cache: string structure
# Rate limiting: counter structure
# WebSocket connections: hash structure

# Performance monitoring
latency-monitor-threshold 0
slowlog-log-slower-than 10000
slowlog-max-len 128

# Persistence optimization
rdbcompression yes
rdbchecksum yes
aof-use-rdb-preamble yes

# Memory optimization
maxmemory 2gb
maxmemory-policy allkeys-lru

# Active defragmentation for better memory usage
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 5
active-defrag-cycle-max 75

# Client buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Redis module loading (if needed)
# loadmodule /path/to/your/module.so

