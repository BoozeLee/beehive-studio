# Beehive Studio PostgreSQL Configuration
# Production-optimized settings for Beehive Studio

# CONNECTIONS AND AUTHENTICATION
# - Connection Settings -
listen_addresses = '*'  # Listen on all interfaces
port = 5432
max_connections = 200  # Adjust based on your expected load

# - Security -
ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'
ssl_ca_file = 'root.crt'
ssl_ciphers = 'HIGH:!aNULL:!MD5'
ssl_prefer_server_ciphers = on
ssl_ecdh_curve = 'prime256v1'

# RESOURCE USAGE
# - Memory -
shared_buffers = 1GB  # 25% of RAM, adjust based on your system
work_mem = 16MB  # For sorting operations
maintenance_work_mem = 256MB
effective_cache_size = 3GB  # Total available memory

# - Disk -
effective_io_concurrency = 200
random_page_cost = 1.1  # SSD optimization
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000.0
max_parallel_workers_per_gather = 4
max_parallel_workers = 8

# WRITE-AHEAD LOG
# - Settings -
wal_level = replica
synchronous_commit = on
fsync = on
wal_compression = on
wal_sync_method = fsync
wal_buffers = 16MB
wal_writer_delay = 200ms  # 200ms

# - Checkpoints -
checkpoint_completion_target = 0.9
checkpoint_timeout = 5min  # 5 minutes
max_wal_size = 4GB
min_wal_size = 1GB

# REPLICATION
# - Settings -
max_wal_senders = 5
max_replication_slots = 5
hot_standby = on
hot_standby_feedback = on

# QUERY TUNING
# - Planner Method Configuration -
enable_seqscan = on
enable_indexscan = on
enable_bitmapscan = on
enable_tidscan = on
enable_sort = on
enable_hashagg = on
enable_nestloop = on
enable_material = on
enable_mergejoin = on
enable_hashjoin = on
enable_partition_pruning = on

# - Error Reporting -
log_min_duration_statement = 1000  # Log statements running longer than 1s
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'ddl'  # Log all DDL statements
log_timezone = 'UTC'

# - Statistics -
log_duration = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0  # Log all temporary files above 0MB

# RUNTIME STATISTICS
# - Query and Statistics Collection -
track_activities = on
track_activity_query_size = 1024
track_io_timing = on
track_counts = on
update_process_title = on

# - Statistics Monitoring -
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.sample_rate = 1.0

# AUTOVACUUM
# - Settings -
autovacuum = on
log_autovacuum_min_duration = 0  # Log all autovacuum actions
autovacuum_max_workers = 6
autovacuum_naptime = 20s
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1
autovacuum_freeze_max_age = 150000000  # 1.5 billion transactions
autovacuum_multixact_freeze_max_age = 150000000

# - Worker Timeout -
autovacuum_vacuum_timeout = 3min
autovacuum_analyze_timeout = 1min

# CLIENT CONNECTION DEFAULTS
# - Statement Timeout -
statement_timeout = 30s  # 30 seconds
lock_timeout = 5s  # 5 seconds
idle_in_transaction_session_timeout = 5min  # 5 minutes

# - Other Defaults -
dynamic_library_path = '$libdir'
temp_buffers = 8MB
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
effective_io_concurrency = 200
random_page_cost = 1.1
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000.0
min_parallel_table_scan_size = 8MB
min_parallel_index_scan_size = 512kB
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 2
max_parallel_workers_gather = 4

# - Locale and Formatting -
datestyle = 'ISO, MDY'
timezone = 'UTC'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# ERROR REPORTING AND LOGGING
# - Where to Log -
log_destination = 'stderr'
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_rotation_age = 1d
log_rotation_size = 0
log_truncate_on_rotation = on

# - What to Log -
client_min_messages = notice
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000  # Log statements running longer than 1s
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0  # Log all temporary files above 0MB
log_autovacuum_min_duration = 0  # Log all autovacuum actions

# - Process Title -
update_process_title = on

# CUSTOMIZED OPTIONS
# Beehive Studio specific settings
shared_preload_libraries = 'pg_stat_statements'

# Query optimization for AI and music production
work_mem = 32MB  # Increase for complex AI queries
maintenance_work_mem = 512MB  # For database maintenance
random_page_cost = 1.0  # Optimized for SSD
effective_cache_size = 4GB

# Connection pooling optimization
max_connections = 150
max_worker_processes = 8

# Monitoring and logging
log_statement = 'ddl'  # Log all DDL statements
log_min_duration_statement = 500  # Log statements running longer than 500ms

# Security settings
password_encryption = scram-sha-256
ssl_renegotiation_limit = 0
ssl_session_timeout = 1h

# Backup and recovery
archive_mode = off
archive_command = ''  # Set up your backup strategy
restore_command = ''  # Set up your restore strategy

# Performance monitoring
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# Beehive Studio specific
# These settings optimize PostgreSQL for music production and AI workloads
# Adjust based on your specific hardware and workload