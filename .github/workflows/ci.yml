name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: services/agent-orchestrator/uv.lock

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - name: Install JS dependencies
        run: pnpm install
        working-directory: apps/desktop

      - name: Install Python dependencies
        run: uv sync --dev
        working-directory: services/agent-orchestrator

      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri

      - name: Check VST Rust formatting
        run: cargo fmt --check
        working-directory: crates/beehive-studio-vst

      - name: Lint Tauri Rust (clippy)
        run: cargo clippy
        working-directory: apps/desktop/src-tauri

      - name: Lint VST Rust (clippy)
        run: cargo clippy
        working-directory: crates/beehive-studio-vst

      - name: Check MixHive Bridge formatting
        run: cargo fmt --check
        working-directory: mixhive_bridge

      - name: Lint MixHive Bridge (clippy)
        run: cargo clippy
        working-directory: mixhive_bridge

      - name: Check Plugin Marketplace formatting
        run: cargo fmt --check
        working-directory: plugin_marketplace

      - name: Lint Plugin Marketplace (clippy)
        run: cargo clippy
        working-directory: plugin_marketplace

      - name: Lint Python (ruff)
        run: uv run ruff check .
        working-directory: services/agent-orchestrator

      - name: TypeScript check
        run: pnpm exec tsc --noEmit
        working-directory: apps/desktop

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: services/agent-orchestrator/uv.lock

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev

      - name: Install JS dependencies
        run: pnpm install
        working-directory: apps/desktop

      - name: Install Python dependencies
        run: uv sync --dev
        working-directory: services/agent-orchestrator

      - name: Run Python tests
        run: uv run pytest -v
        working-directory: services/agent-orchestrator

      - name: Run Rust tests (Tauri)
        run: cargo test
        working-directory: apps/desktop/src-tauri

      - name: Run MixHive Bridge tests
        run: cargo test
        working-directory: mixhive_bridge

      - name: Run Plugin Marketplace tests
        run: cargo test
        working-directory: plugin_marketplace

  build-check:
    name: Build Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev

      - name: Install JS dependencies
        run: pnpm install
        working-directory: apps/desktop

      - name: Check Tauri app compiles
        run: cargo check
        working-directory: apps/desktop/src-tauri

      - name: Check VST plugin compiles
        run: cargo check
        working-directory: crates/beehive-studio-vst

      - name: Check MixHive Bridge compiles
        run: cargo check
        working-directory: mixhive_bridge

      - name: Check Plugin Marketplace compiles
        run: cargo check
        working-directory: plugin_marketplace

      - name: Build TypeScript
        run: pnpm build
        working-directory: apps/desktop
