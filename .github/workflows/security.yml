name: Beehive Studio Security Scan

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  codeql-analysis:
    # Runs CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r services/agent-orchestrator/requirements.txt
        cd apps/desktop && npm install

    - name: Checkout additional languages
      uses: actions/checkout@v4

    - name: Autobuild
      uses: github/codeql-action/autobuild@v2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/perform-analysis@v2
      with:
        languages: ${{ matrix.language }}
        build-mode: 'manual'

  secret-scanning:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Run secret scanning
      uses: gitleaks/gitleaks-action@v1
      with:
        args: --config=.gitleaks.toml

  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install OWASP Dependency Check
      run: |
        pip install dependency-check

    - name: Run dependency check
      run: |
        dependency-check --project "Beehive Studio" --scan "./services/agent-orchestrator" --format "HTML" --out "dependency-check-results"

    - name: Upload dependency check results
      uses: actions/upload-artifact@v3
      with:
        name: dependency-check-results
        path: dependency-check-results/