name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: services/agent-orchestrator/uv.lock

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            python3-pip

      - name: Pre-approve esbuild builds
        run: pnpm approve-builds esbuild
        working-directory: apps/desktop

      - name: Install JS dependencies
        run: pnpm install
        working-directory: apps/desktop

      - name: Install Python dependencies
        run: uv sync
        working-directory: services/agent-orchestrator

      - name: Build VST plugin
        run: cargo build --release
        working-directory: crates/beehive-studio-vst

      - name: Build desktop app
        run: pnpm tauri build --bundles deb
        working-directory: apps/desktop

      - name: Package release artifacts
        run: |
          mkdir -p dist/release
          VERSION="${GITHUB_REF_NAME#v}"
          cp crates/beehive-studio-vst/target/release/libbeehive_studio_vst.so \
             "dist/release/beehive-studio-vst-${VERSION}.so"
          cp -r apps/desktop/src-tauri/target/release/bundle/deb/*.deb \
             dist/release/ 2>/dev/null || true
          cp -r apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage \
             dist/release/ 2>/dev/null || true
          cp DEPLOYMENT.md dist/release/
          cp ROADMAP.md dist/release/
          echo "Artifacts prepared:"
          ls -lh dist/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Beehive Studio ${{ github.ref_name }}"
          body_path: DEPLOYMENT.md
          files: dist/release/*
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
